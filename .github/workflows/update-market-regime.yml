name: Update Market Regime

on:
  schedule:
    # 16:45 IST = 11:15 UTC (after market close)
    - cron: "15 11 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Update market regime
        run: |
          python scripts/update_market_regime.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add backend/data/market_regime.json
          git diff --cached --quiet || git commit -m "Auto-update market regime"
          git push