<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend Regime</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  margin:0;
  background:transparent;
  color:#e5e7eb;
}
svg{max-width:100%;height:auto}
</style>
</head>

<body>

<section class="p-3 rounded-xl bg-gray-800 text-center">

  <div id="regimeHeader" class="font-semibold mb-2">
    Trend Daily TF: --
  </div>

  <svg viewBox="0 0 200 110" class="mx-auto">

    <!-- RED -->
    <path d="M20 100 A80 80 0 0 1 60 40"
          stroke="#ef4444" stroke-width="14" fill="none"/>

    <!-- YELLOW -->
    <path d="M60 40 A80 80 0 0 1 140 40"
          stroke="#facc15" stroke-width="14" fill="none"/>

    <!-- GREEN -->
    <path d="M140 40 A80 80 0 0 1 180 100"
          stroke="#16a34a" stroke-width="14" fill="none"/>

    <!-- EMA labels -->
    <text x="70" y="52" font-size="12" fill="#e5e7eb"
          text-anchor="middle" dominant-baseline="middle"
          transform="rotate(-35 70 52)">200</text>

    <text x="130" y="52" font-size="12" fill="#e5e7eb"
          text-anchor="middle" dominant-baseline="middle"
          transform="rotate(35 130 52)">50</text>

    <!-- Needle -->
    <g id="needle" transform="rotate(0 100 100)">
      <line x1="100" y1="100" x2="100" y2="55"
            stroke="#f9fafb"
            stroke-width="5"
            stroke-linecap="round"/>
    </g>

    <circle cx="100" cy="100" r="6" fill="#f9fafb"/>
  </svg>

  <div class="font-semibold mt-1">EMA Trend Strength</div>

  <div id="regimeUpdated" class="text-xs opacity-70 mt-1">
    Last updated: --
  </div>

</section>

<script>
const API = "https://macro-dashboard-vk03.onrender.com";

async function fetchRegime(){
  try{
    const r = await fetch(API + "/market-regime");
    return r.ok ? await r.json() : null;
  }catch{
    return null;
  }
}

async function loadRegime(){
  const d = await fetchRegime();
  if(!d) return;

  // % distance from EMA200 (ONLY LOGIC)
  let pct = ((d.close - d.ema200) / d.ema200) * 100;

  // clamp for visual sanity
  pct = Math.max(-2, Math.min(2, pct));

  // map -2..0..+2 → -90..0..+90
  const angle = (pct / 2) * 90;

  document.getElementById("needle")
    .setAttribute("transform", `rotate(${angle} 100 100)`);

  document.getElementById("regimeHeader")
    .innerText = `Trend Daily TF: ${d.trend_regime}`;

  document.getElementById("regimeUpdated")
    .innerText = "Last updated: " + new Date().toLocaleString();

  notifyHeight();
}

loadRegime();
</script>

<script>
function notifyHeight(){
  const height = document.documentElement.scrollHeight;
  window.parent.postMessage(
    { type: "REGIME_HEIGHT", height },
    "*"
  );
}

window.addEventListener("load", notifyHeight);
window.addEventListener("resize", notifyHeight);
setTimeout(notifyHeight, 200);
setTimeout(notifyHeight, 500);
</script>

</body>
</html>
