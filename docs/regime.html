<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend Regime</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  margin:0;
  background:#0f172a; /* dashboard background */
  color:#e5e7eb;
}
svg{max-width:100%;height:auto}

/* Trend card colors */
.trend-bullish { background:#16a34a; }
.trend-bearish { background:#dc2626; }
.trend-correction {
  background:#facc15;
  color:#1f2937;
}
.trend-neutral { background:#1f2937; }
</style>
</head>

<body>

<!-- TREND CARD -->
<section class="text-center">
  <div id="regimeHeader"
       class="m-4 p-4 rounded-xl font-semibold text-lg trend-neutral">
    Trend : --
  </div>
</section>

<!-- GAUGE -->
<section class="p-3 text-center">

<svg viewBox="0 0 200 110" class="mx-auto">

  <!-- DEFINITIONS (MUST COME FIRST) -->
  <defs>
    <!-- Needle shadow -->
    <filter id="needleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5"
                    flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Center pivot shadow -->
    <filter id="pivotShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2"
                    flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- RED -->
  <path d="M20 100 A80 80 0 0 1 60 40"
        stroke="#ef4444" stroke-width="14" fill="none"/>

  <!-- YELLOW -->
  <path d="M60 40 A80 80 0 0 1 140 40"
        stroke="#facc15" stroke-width="14" fill="none"/>

  <!-- GREEN -->
  <path d="M140 40 A80 80 0 0 1 180 100"
        stroke="#16a34a" stroke-width="14" fill="none"/>

  <!-- EMA labels -->
  <text x="70" y="52" font-size="12" fill="#e5e7eb"
        text-anchor="middle" dominant-baseline="middle"
        transform="rotate(-35 70 52)">200</text>

  <text x="130" y="52" font-size="12" fill="#e5e7eb"
        text-anchor="middle" dominant-baseline="middle"
        transform="rotate(35 130 52)">50</text>

  <!-- NEEDLE (LOGIC UNCHANGED) -->
  <g id="needle" transform="rotate(-45 100 100)">
    <line x1="100" y1="100" x2="100" y2="55"
          stroke="#f9fafb"
          stroke-width="5"
          stroke-linecap="round"
          filter="url(#needleShadow)"/>
  </g>

  <!-- CENTER PIVOT -->
  <circle cx="100" cy="100" r="6"
          fill="#f9fafb"
          filter="url(#pivotShadow)"/>
</svg>

<div class="font-semibold mt-1">EMA</div>

<div id="regimeUpdated" class="text-xs opacity-70 mt-1">
  As of: --
</div>

</section>

<script>
const API="https://macro-dashboard-vk03.onrender.com";

async function fetchRegime(){
  try{
    const r=await fetch(API+"/market-regime");
    return r.ok ? await r.json() : null;
  }catch{
    return null;
  }
}

async function loadRegime(){
  const d=await fetchRegime();
  if(!d) return;

  /* ===== NEEDLE LOGIC (UNCHANGED) ===== */
  let pct=((d.close-d.ema200)/d.ema200)*100;
  pct=Math.max(-2,Math.min(2,pct));
  const angle=-30+(pct/2)*60;

  document.getElementById("needle")
    .setAttribute("transform",`rotate(${angle} 100 100)`);

  /* ===== TREND CARD COLOR ===== */
  const header=document.getElementById("regimeHeader");
  header.classList.remove(
    "trend-bullish",
    "trend-bearish",
    "trend-correction",
    "trend-neutral"
  );

  header.innerText=`Trend : ${d.trend_regime}`;

  const r=d.trend_regime.toLowerCase();
  if(r==="bullish"){
    header.classList.add("trend-bullish");
  }else if(r==="bearish"){
    header.classList.add("trend-bearish");
  }else if(r==="correction" || r==="corrective"){
    header.classList.add("trend-correction");
  }else{
    header.classList.add("trend-neutral");
  }

  document.getElementById("regimeUpdated").innerText =
    d.as_of ? "As of: " + d.as_of : "As of: Previous close";

  notifyHeight();
}

loadRegime();
</script>

<script>
function notifyHeight(){
  const height=document.documentElement.scrollHeight;
  window.parent.postMessage(
    { type:"REGIME_HEIGHT", height },
    "*"
  );
}

window.addEventListener("load",notifyHeight);
setTimeout(notifyHeight,100);
setTimeout(notifyHeight,300);
setTimeout(notifyHeight,600);
window.addEventListener("resize",notifyHeight);
</script>

</body>
</html>
