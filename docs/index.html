<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class' }
</script>

<style>
.card {
  position: relative;
  display: flex;
  justify-content: space-between;
  padding: 1rem;
  border-radius: 0.75rem;
  border-left-width: 4px;
  background-color: white;
}
.dark .card { background-color: #1f2937; }

svg { max-width: 100%; height: auto; }
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

<!-- HEADER -->
<header class="flex justify-between p-4 bg-gray-200 dark:bg-gray-800">
  <div>
    <div class="flex items-center gap-3">
      <img src="logo.png" class="h-8 w-8 object-contain" />
      <h1 class="text-xl font-semibold">Macro Dashboard</h1>
    </div>
    <div id="lastUpdated" class="text-xs opacity-70 mt-1">Last updated: --</div>
  </div>
  <div class="space-x-2">
    <button id="refreshBtn" class="bg-blue-600 text-white px-3 py-1 rounded">🔄</button>
    <button id="themeToggle" class="bg-gray-300 dark:bg-gray-700 px-3 py-1 rounded">🌙</button>
  </div>
</header>

<!-- MARKET CLIMATE -->
<section id="climateBanner" class="m-4 p-4 rounded-xl text-center font-semibold text-lg">
  Market Climate: --
</section>

<!-- SPEEDOMETER REGIME -->
<section class="m-4 p-4 rounded-xl bg-white dark:bg-gray-800 text-center">
  <h2 class="font-semibold mb-2">Trend Regime</h2>

  <svg viewBox="0 0 200 110" class="mx-auto">
    <!-- Zones -->
    <path d="M10 100 A90 90 0 0 1 70 20" fill="none" stroke="#dc2626" stroke-width="14"/>
    <path d="M70 20 A90 90 0 0 1 130 20" fill="none" stroke="#facc15" stroke-width="14"/>
    <path d="M130 20 A90 90 0 0 1 190 100" fill="none" stroke="#16a34a" stroke-width="14"/>

    <!-- Needle (VISIBLE FIX) -->
    <line id="needle"
      x1="100" y1="100"
      x2="100" y2="35"
      stroke="#111827"
      stroke-width="4"
      stroke-linecap="round"
      transform-origin="100px 100px"
      transform="rotate(-90 100 100)" />

    <circle cx="100" cy="100" r="6" fill="#111827"/>
  </svg>

  <div id="regimeText" class="font-semibold mt-2">--</div>
  <div id="regimeUpdated" class="text-xs opacity-70">Based on previous close</div>
</section>

<main class="p-4 space-y-10">

<!-- MACRO CARDS -->
<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">

  <div id="dxyCard" class="card"><div>DXY</div><div><div id="dxy">--</div><div id="dxyPct" class="text-sm opacity-70"></div></div></div>
  <div id="jpyCard" class="card"><div>USD / JPY</div><div><div id="usdjpy">--</div><div id="usdjpyPct" class="text-sm opacity-70"></div></div></div>
  <div id="inrCard" class="card"><div>USD / INR</div><div><div id="usdinr">--</div><div id="usdinrPct" class="text-sm opacity-70"></div></div></div>
  <div id="crudeCard" class="card"><div>Brent</div><div><div id="crude">--</div><div id="crudePct" class="text-sm opacity-70"></div></div></div>
  <div id="us10yCard" class="card"><div>US 10Y</div><div><div id="us10y">--</div><div id="us10yPct" class="text-sm opacity-70"></div></div></div>
  <div id="us2yCard" class="card"><div>US 2Y</div><div><div id="us2y">--</div><div id="us2yPct" class="text-sm opacity-70"></div></div></div>
  <div id="spreadCard" class="card"><div>Yield Spread</div><div><div id="spread">--</div></div></div>

</section>

<!-- NEWS (GLOBAL + INDIA RESTORED) -->
<section class="m-4 mt-10">
  <div class="flex justify-between items-center mb-3">
    <h2 class="text-lg font-semibold">📰 Market News</h2>
    <div class="flex bg-gray-200 dark:bg-gray-700 rounded-lg p-1 text-xs">
      <button id="globalNewsBtn" class="px-3 py-1 rounded-md bg-blue-600 text-white">Global</button>
      <button id="indiaNewsBtn" class="px-3 py-1 rounded-md text-gray-700 dark:text-gray-200">India</button>
    </div>
  </div>

  <div class="rounded-xl border bg-white dark:bg-gray-800">
    <div id="newsList" class="max-h-96 overflow-y-auto divide-y text-sm">
      <div class="p-3 opacity-60">Loading news…</div>
    </div>
  </div>
</section>

</main>

<script>
const API="https://macro-dashboard-vk03.onrender.com";
const $=id=>document.getElementById(id);
const setColor=(el,c)=>{ if(el) el.style.borderLeftColor=c };

// THEME
const t=$("themeToggle");
const s=localStorage.getItem("theme");
if(s==="light"){document.documentElement.classList.remove("dark");t.innerText="☀️";}
else{document.documentElement.classList.add("dark");t.innerText="🌙";}
t.onclick=()=>{
  const d=document.documentElement.classList.contains("dark");
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme",d?"light":"dark");
  t.innerText=d?"☀️":"🌙";
};

async function j(p){
  try{ const r=await fetch(API+p); return r.ok?await r.json():null; }
  catch{ return null; }
}

/* ===== REGIME ===== */
async function loadRegime(){
  const d=await j("/market-regime");
  if(!d||!d.close) return;

  const { close, ema50, ema200, trend_regime } = d;
  let pos=(close-ema200)/(ema50-ema200);
  pos=Math.max(-0.2,Math.min(1.2,pos));
  const angle=-90+(pos*180);

  $("needle").setAttribute("transform",`rotate(${angle} 100 100)`);
  $("regimeText").innerText=trend_regime;
}

/* ===== MACRO + CLIMATE ===== */
async function load(){
  const dxy=await j("/dxy");
  const jpy=await j("/usd-jpy");
  const inr=await j("/usd-inr");
  const crude=await j("/crude");
  const y=await j("/us-yields");
  if(!dxy||!jpy||!inr||!crude||!y) return;

  $("dxy").innerText=dxy.dxy; $("dxyPct").innerText=dxy.pct_change+"%";
  setColor(dxyCard,dxy.dxy>100.5?"red":dxy.dxy>=99.5?"orange":"green");

  $("usdjpy").innerText=jpy.usd_jpy; $("usdjpyPct").innerText=jpy.pct_change+"%";
  setColor(jpyCard,jpy.usd_jpy<148?"red":jpy.usd_jpy<=150?"orange":"green");

  $("usdinr").innerText=inr.price; $("usdinrPct").innerText=inr.pct_change+"%";
  setColor(inrCard,inr.pct_change>0.5?"red":inr.pct_change>=0.2?"orange":"green");

  $("crude").innerText=crude.price; $("crudePct").innerText=crude.pct_change+"%";
  setColor(crudeCard,crude.pct_change>2.5?"red":crude.pct_change>=1?"orange":"green");

  $("us10y").innerText=y.us_10y; $("us10yPct").innerText=y.us_10y_pct+"%";
  $("us2y").innerText=y.us_2y; $("us2yPct").innerText=y.us_2y_pct+"%";
  $("spread").innerText=y.yield_spread;

  $("lastUpdated").innerText="Last updated: "+new Date().toLocaleString();
}

/* ===== NEWS ===== */
let currentNews="global";
async function loadNews(region){
  currentNews=region;
  const box=$("newsList");
  box.innerHTML="<div class='p-3 opacity-60'>Loading news…</div>";

  try{
    const r=await fetch(`${API}/news?region=${region}`);
    const d=await r.json();
    box.innerHTML="";
    d.items.forEach(n=>{
      const div=document.createElement("div");
      div.className="p-3 hover:bg-gray-100 dark:hover:bg-gray-700";
      div.innerHTML=`<a href="${n.link}" target="_blank">${n.title}</a>`;
      box.appendChild(div);
    });
  }catch{
    box.innerHTML="<div class='p-3 text-red-500'>Failed to load news</div>";
  }
}

globalNewsBtn.onclick=()=>{
  globalNewsBtn.className="px-3 py-1 rounded-md bg-blue-600 text-white";
  indiaNewsBtn.className="px-3 py-1 rounded-md text-gray-700 dark:text-gray-200";
  loadNews("global");
};
indiaNewsBtn.onclick=()=>{
  indiaNewsBtn.className="px-3 py-1 rounded-md bg-blue-600 text-white";
  globalNewsBtn.className="px-3 py-1 rounded-md text-gray-700 dark:text-gray-200";
  loadNews("india");
};

refreshBtn.onclick=()=>{ load(); loadRegime(); loadNews(currentNews); };

load();
loadRegime();
loadNews("global");
</script>

</body>
</html>
