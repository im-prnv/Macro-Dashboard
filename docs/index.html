<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-base:  #080c14;
    --bg-card:  #0d1220;
    --bg-card2: #111827;
    --border:   #1e2d45;
    --accent:   #38bdf8;
    --text-1:   #e2eaf5;
    --text-2:   #6b8aad;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; }

  html, body {
    font-family: 'Syne', sans-serif;
    background: var(--bg-base);
    color: var(--text-1);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(56,189,248,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,.025) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* HEADER */
  header {
    position: relative; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1.5rem;
    background: rgba(8,12,20,.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .logo-wrap { display: flex; align-items: center; gap: .75rem; }
  .logo-wrap img { height: 2rem; width: 2rem; object-fit: contain; filter: drop-shadow(0 0 6px var(--accent)); }
  .logo-wrap h1 {
    font-size: 1.1rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #lastUpdated { font-family: 'Space Mono', monospace; font-size: .65rem; color: var(--text-2); margin-top: .25rem; letter-spacing: .04em; }

  .hdr-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.25rem; height: 2.25rem; border-radius: .5rem;
    border: 1px solid var(--border); background: var(--bg-card2);
    cursor: pointer; font-size: 1rem; transition: all .2s;
  }
  .hdr-btn:hover { border-color: var(--accent); box-shadow: 0 0 10px rgba(56,189,248,.35); transform: scale(1.08); }

  /* CLIMATE BANNER */
  #climateBanner {
    position: relative; z-index: 5;
    margin: 1.25rem 1.5rem .5rem;
    padding: .75rem 1.5rem;
    border-radius: .75rem;
    font-family: 'Space Mono', monospace;
    font-size: .9rem; font-weight: 700; letter-spacing: .1em; text-align: center;
    border: 1px solid var(--border); background: var(--bg-card);
    animation: fadeSlideDown .5s ease both;
  }

  /* REGIME SECTION */
  .regime-section {
    position: relative; z-index: 5;
    margin: .75rem 1.5rem;
    padding: 1.5rem 1.25rem 1.25rem;
    border-radius: 1rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    text-align: center;
    animation: fadeSlideDown .55s ease both;
  }

  #regimeHeader {
    display: inline-block;
    margin-bottom: 1rem;
    padding: .4rem 1.75rem;
    border-radius: 999px;
    font-family: 'Space Mono', monospace;
    font-size: .8rem; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    background: #1e293b; color: var(--text-1);
    border: 1px solid var(--border);
    transition: background .4s, border-color .4s, color .4s;
  }

  #regimeUpdated {
    font-family: 'Space Mono', monospace;
    font-size: .65rem; color: var(--text-2);
    margin-top: .5rem; letter-spacing: .04em;
  }

  /* GAUGE */
  .gauge-wrap {
    position: relative;
    width: 100%; max-width: 340px;
    margin: 0 auto;
  }
  .gauge-wrap svg { display: block; width: 100%; overflow: visible; }

  /* Arc draw-on: each arc has stroke-dasharray = its arc length (r=120, each 60° = 120*pi/3 ≈ 125.7) */
  .arc-anim {
    stroke-dasharray: 126;
    stroke-dashoffset: 126;
  }
  .arc-red    { animation: drawArc .7s  .15s cubic-bezier(.4,0,.2,1) forwards; }
  .arc-yellow { animation: drawArc .7s  .5s  cubic-bezier(.4,0,.2,1) forwards; }
  .arc-green  { animation: drawArc .7s  .85s cubic-bezier(.4,0,.2,1) forwards; }

  @keyframes drawArc {
    to { stroke-dashoffset: 0; }
  }

  /* Needle: starts pointing straight up (0deg = 12 o'clock = middle of gauge)
     Entry: sweeps in from -90deg (far left), ends at 0 (centre) then JS sets final */
  #needle {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 1s cubic-bezier(.34,1.4,.64,1);
    animation: needleSweep 1s .9s cubic-bezier(.34,1.3,.64,1) both;
  }
  @keyframes needleSweep {
    from { transform: rotate(-90deg); }
    to   { transform: rotate(0deg); }
  }

  /* Pivot glow pulse */
  .pivot-outer { animation: pivotPulse 2.5s 2s ease-in-out infinite; }
  @keyframes pivotPulse {
    0%,100% { opacity: .6; }
    50%      { opacity: 1; }
  }
  .pivot-dot { animation: pivotGrow 2.5s 2s ease-in-out infinite; }
  @keyframes pivotGrow {
    0%,100% { r: 4.5; }
    50%      { r: 6.5; }
  }

  /* CARDS */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: .75rem; padding: 0 1.5rem; margin-top: 1rem;
  }
  .card {
    position: relative;
    background: var(--bg-card); border: 1px solid var(--border);
    border-left: 3px solid transparent; border-radius: .875rem;
    padding: 1rem; display: flex; flex-direction: column; gap: .35rem;
    overflow: hidden;
    transition: transform .2s, box-shadow .2s, border-left-color .3s;
    animation: fadeScaleIn .4s ease both; cursor: default;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(56,189,248,.1); }
  .card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(56,189,248,.03), transparent 60%);
    pointer-events: none; border-radius: inherit;
  }
  .card-label { font-size: .65rem; font-family: 'Space Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
  .card-value { font-family: 'Space Mono', monospace; font-size: 1.05rem; font-weight: 700; color: var(--text-1); letter-spacing: .03em; }
  .card-pct   { font-family: 'Space Mono', monospace; font-size: .7rem; color: var(--text-2); }

  .card:nth-child(1){animation-delay:.04s} .card:nth-child(2){animation-delay:.09s}
  .card:nth-child(3){animation-delay:.13s} .card:nth-child(4){animation-delay:.17s}
  .card:nth-child(5){animation-delay:.21s} .card:nth-child(6){animation-delay:.25s}
  .card:nth-child(7){animation-delay:.29s}

  /* SECTION LABEL */
  .section-label {
    font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-2); padding: 1.5rem 1.5rem .5rem;
    display: flex; align-items: center; gap: .5rem;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* NEWS */
  .news-wrap {
    position: relative; z-index: 5;
    margin: 0 1.5rem 2rem; border-radius: 1rem;
    background: var(--bg-card); border: 1px solid var(--border); overflow: hidden;
  }
  .news-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: .875rem 1.25rem; border-bottom: 1px solid var(--border);
  }
  .news-title { font-size: .85rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .news-tabs {
    display: flex; background: var(--bg-base);
    border: 1px solid var(--border); border-radius: .5rem; padding: .2rem; gap: .2rem;
  }
  .news-tab {
    font-family: 'Space Mono', monospace; font-size: .65rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; padding: .3rem .85rem;
    border-radius: .35rem; border: none; cursor: pointer;
    background: transparent; color: var(--text-2); transition: all .2s;
  }
  .news-tab.active { background: var(--accent); color: #080c14; box-shadow: 0 0 12px rgba(56,189,248,.45); }
  #newsList { max-height: 22rem; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #newsList .news-item { padding: .75rem 1.25rem; border-bottom: 1px solid var(--border); font-size: .82rem; line-height: 1.5; transition: background .15s; }
  #newsList .news-item:last-child { border-bottom: none; }
  #newsList .news-item:hover { background: rgba(56,189,248,.04); }
  #newsList .news-item a { color: var(--text-1); text-decoration: none; transition: color .15s; }
  #newsList .news-item a:hover { color: var(--accent); }

  /* LIGHT MODE */
  html:not(.dark) { --bg-base:#f0f4f8; --bg-card:#fff; --bg-card2:#e9eef5; --border:#d0dae8; --text-1:#0f172a; --text-2:#5a7a9e; }
  html:not(.dark) body { background: var(--bg-base); }
  html:not(.dark) .logo-wrap h1 { background: linear-gradient(90deg,#0284c7,#6366f1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  html:not(.dark) body::before { background-image: linear-gradient(rgba(2,132,199,.04) 1px,transparent 1px), linear-gradient(90deg,rgba(2,132,199,.04) 1px,transparent 1px); }

  /* ANIMATIONS */
  @keyframes fadeSlideDown { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeScaleIn   { from{opacity:0;transform:scale(.94)}         to{opacity:1;transform:scale(1)} }
  @keyframes spin          { to{transform:rotate(360deg)} }
  .spinning { animation: spin .7s linear infinite; }

  iframe { max-width: 100%; }
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div>
    <div class="logo-wrap">
      <img src="logo.png" />
      <h1>Macro Dashboard</h1>
    </div>
    <div id="lastUpdated">Last updated: --</div>
  </div>
  <div style="display:flex;gap:.5rem">
    <button id="refreshBtn" class="hdr-btn" title="Refresh">🔄</button>
    <button id="themeToggle" class="hdr-btn" title="Toggle theme">🌙</button>
  </div>
</header>

<!-- MARKET CLIMATE -->
<section id="climateBanner">Market Climate: --</section>

<!-- TREND REGIME -->
<section class="regime-section">

  <div id="regimeHeader">Trend : --</div>

  <!--
    ViewBox: 320 × 185
    Semicircle: centre=(160,160), r=120
    Key points (SVG coords, y-down):
      180° (left)  = (40,  160)
      120°         = (100,  56.1)   [160+120·cos120, 160-120·sin120]
       60°         = (220,  56.1)
        0° (right) = (280, 160)
    Arc length per 60° segment = 120·π/3 ≈ 125.7  → dasharray 126
  -->
  <div class="gauge-wrap">
  <svg viewBox="0 0 320 185" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowYellow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="needleGlow" x="-100%" y="-50%" width="300%" height="200%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Dark track -->
    <path d="M 40 160 A 120 120 0 0 1 280 160"
      stroke="#182236" stroke-width="24" fill="none" stroke-linecap="round"/>

    <!-- RED segment (180°→120°) -->
    <path class="arc-anim arc-red"
      d="M 40 160 A 120 120 0 0 1 100 56.1"
      stroke="#ef4444" stroke-width="22" fill="none"
      stroke-linecap="round" filter="url(#glowRed)"/>

    <!-- YELLOW segment (120°→60°) -->
    <path class="arc-anim arc-yellow"
      d="M 100 56.1 A 120 120 0 0 1 220 56.1"
      stroke="#eab308" stroke-width="22" fill="none"
      stroke-linecap="round" filter="url(#glowYellow)"/>

    <!-- GREEN segment (60°→0°) -->
    <path class="arc-anim arc-green"
      d="M 220 56.1 A 120 120 0 0 1 280 160"
      stroke="#22c55e" stroke-width="22" fill="none"
      stroke-linecap="round" filter="url(#glowGreen)"/>

    <!-- Divider ticks between segments -->
    <line x1="100" y1="56.1" x2="117" y2="75"
      stroke="#0d1220" stroke-width="4" stroke-linecap="round"/>
    <line x1="220" y1="56.1" x2="203" y2="75"
      stroke="#0d1220" stroke-width="4" stroke-linecap="round"/>

    <!-- EMA labels -->
    <text x="76" y="106" font-size="15" fill="#94a3b8"
      font-family="Space Mono, monospace" text-anchor="middle" font-weight="700">200</text>
    <text x="244" y="106" font-size="15" fill="#94a3b8"
      font-family="Space Mono, monospace" text-anchor="middle" font-weight="700">50</text>

    <!--
      NEEDLE — pivot at (160,160).
      Unrotated = pointing straight up = middle of gauge.
      transform-origin is set to the pivot point via CSS transform-box:fill-box + transform-origin:center
      but since the needle group is positioned with pivot at 160,160 that works.
      JS will set: rotate(Ndeg) where N in [-90,+90]
    -->
    <g id="needle" style="transform-origin: 160px 160px;">
      <!-- Drop shadow -->
      <line x1="160" y1="160" x2="160" y2="48"
        stroke="rgba(0,0,0,.55)" stroke-width="7" stroke-linecap="round"/>
      <!-- Needle body -->
      <line x1="160" y1="160" x2="160" y2="48"
        stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"
        filter="url(#needleGlow)"/>
      <!-- Tail -->
      <line x1="160" y1="160" x2="160" y2="178"
        stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Pivot decoration -->
    <circle class="pivot-outer" cx="160" cy="160" r="16"
      fill="none" stroke="#38bdf8" stroke-width="1.5" opacity=".5"/>
    <circle cx="160" cy="160" r="12" fill="#0d1220" stroke="#1e2d45" stroke-width="1.5"/>
    <circle cx="160" cy="160" r="7"  fill="#0a1628" stroke="#38bdf8" stroke-width="1.5"/>
    <circle class="pivot-dot" cx="160" cy="160" r="4.5" fill="#38bdf8"/>
    <circle cx="160" cy="160" r="1.8" fill="#e2eaf5"/>

  </svg>
  </div>

  <div style="font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--text-2);margin-top:.4rem">EMA</div>
  <div id="regimeUpdated" style="font-family:'Space Mono',monospace;font-size:.62rem;
    color:var(--text-2);margin-top:.2rem;letter-spacing:.04em">As of: --</div>

</section>

<!-- MACRO CARDS -->
<div class="section-label">Market Indicators</div>
<div class="cards-grid">
  <div id="dxyCard"    class="card"><div class="card-label">DXY</div><div class="card-value" id="dxy">--</div><div class="card-pct" id="dxyPct"></div></div>
  <div id="jpyCard"    class="card"><div class="card-label">USD / JPY</div><div class="card-value" id="usdjpy">--</div><div class="card-pct" id="usdjpyPct"></div></div>
  <div id="inrCard"    class="card"><div class="card-label">USD / INR</div><div class="card-value" id="usdinr">--</div><div class="card-pct" id="usdinrPct"></div></div>
  <div id="crudeCard"  class="card"><div class="card-label">Brent</div><div class="card-value" id="crude">--</div><div class="card-pct" id="crudePct"></div></div>
  <div id="us10yCard"  class="card"><div class="card-label">US 10Y</div><div class="card-value" id="us10y">--</div><div class="card-pct" id="us10yPct"></div></div>
  <div id="us2yCard"   class="card"><div class="card-label">US 2Y</div><div class="card-value" id="us2y">--</div><div class="card-pct" id="us2yPct"></div></div>
  <div id="spreadCard" class="card"><div class="card-label">Yield Spread</div><div class="card-value" id="spread">--</div></div>
</div>

<!-- NEWS -->
<div class="section-label" style="margin-top:1.75rem">Market News</div>
<div class="news-wrap">
  <div class="news-header">
    <span class="news-title">📰 Latest</span>
    <div class="news-tabs">
      <button id="globalNewsBtn" class="news-tab active">Global</button>
      <button id="indiaNewsBtn"  class="news-tab">India</button>
    </div>
  </div>
  <div id="newsList">
    <div class="news-item" style="opacity:.5">Loading news…</div>
  </div>
</div>

<script>
const API="https://macro-dashboard-vk03.onrender.com";
const $=id=>document.getElementById(id);
const setColor=(el,c)=>{ if(el) el.style.borderLeftColor=c };

// THEME
const themeToggle=$("themeToggle");
const saved=localStorage.getItem("theme");
if(saved==="light"){document.documentElement.classList.remove("dark");themeToggle.innerText="☀️";}
else{document.documentElement.classList.add("dark");themeToggle.innerText="🌙";}
themeToggle.onclick=()=>{
  const d=document.documentElement.classList.contains("dark");
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme",d?"light":"dark");
  themeToggle.innerText=d?"☀️":"🌙";
};

async function j(p){
  try{ const r=await fetch(API+p); return r.ok?await r.json():null; }
  catch{ return null; }
}

/* ===== MACRO + CLIMATE ===== */
async function load(){
  const dxy=await j("/dxy");
  const jpy=await j("/usd-jpy");
  const inr=await j("/usd-inr");
  const crude=await j("/crude");
  const y=await j("/us-yields");
  if(!dxy||!jpy||!inr||!crude||!y) return;

  $("dxy").innerText=dxy.dxy;
  $("dxyPct").innerText=dxy.pct_change+"%";
  setColor(dxyCard,dxy.dxy>100.5?"red":dxy.dxy>=99.5?"orange":"green");

  $("usdjpy").innerText=jpy.usd_jpy;
  $("usdjpyPct").innerText=jpy.pct_change+"%";
  setColor(jpyCard,jpy.usd_jpy<148?"red":jpy.usd_jpy<=150?"orange":"green");

  $("usdinr").innerText=inr.price;
  $("usdinrPct").innerText=inr.pct_change+"%";
  setColor(inrCard,inr.pct_change>0.5?"red":inr.pct_change>=0.2?"orange":"green");

  $("crude").innerText=crude.price;
  $("crudePct").innerText=crude.pct_change+"%";
  setColor(crudeCard,crude.pct_change>2.5?"red":crude.pct_change>=1?"orange":"green");

  $("us10y").innerText=y.us_10y;
  $("us10yPct").innerText=y.us_10y_pct+"%";
  setColor(us10yCard,y.us_10y>4.1?"red":y.us_10y>=3.9?"orange":"green");

  $("us2y").innerText=y.us_2y;
  $("us2yPct").innerText=y.us_2y_pct+"%";
  setColor(us2yCard,y.us_2y>4.2?"red":y.us_2y>=4.0?"orange":"green");

  $("spread").innerText=y.yield_spread;
  setColor(spreadCard,y.yield_spread<0?"red":y.yield_spread<=0.5?"orange":"green");

  let stress=0;
  if(dxy.dxy>100.5)stress++;
  if(jpy.usd_jpy<148)stress++;
  if(inr.pct_change>0.5)stress++;
  if(crude.pct_change>2.5)stress++;
  if(y.us_10y>4.1)stress++;
  if(y.us_2y>4.2)stress++;
  if(y.yield_spread<0)stress++;

  const cb=$("climateBanner");
  if(stress<=1){
    cb.innerText="🌤️ Market Climate: Favorable";
    cb.style.background="rgba(22,163,74,.18)"; cb.style.borderColor="#16a34a"; cb.style.color="#4ade80";
  }else if(stress<=3){
    cb.innerText="🌥️ Market Climate: Cautious";
    cb.style.background="rgba(234,179,8,.15)"; cb.style.borderColor="#eab308"; cb.style.color="#fde047";
  }else{
    cb.innerText="🌩️ Market Climate: Stressed";
    cb.style.background="rgba(220,38,38,.18)"; cb.style.borderColor="#dc2626"; cb.style.color="#f87171";
  }

  $("lastUpdated").innerText="Last updated: "+new Date().toLocaleString();
}

/* ===== NEWS ===== */
let currentNews="global";
async function loadNews(region){
  currentNews=region;
  const box=$("newsList");
  box.innerHTML="<div class='news-item' style='opacity:.5'>Loading news…</div>";
  try{
    const r=await fetch(`${API}/news?region=${region}`);
    const d=await r.json();
    box.innerHTML="";
    d.items.forEach(n=>{
      const div=document.createElement("div");
      div.className="news-item";
      div.innerHTML=`<a href="${n.link}" target="_blank">${n.title}</a>`;
      box.appendChild(div);
    });
  }catch{
    box.innerHTML="<div class='news-item' style='color:#ef4444'>Failed to load news</div>";
  }
}

globalNewsBtn.onclick=()=>{
  globalNewsBtn.classList.add("active"); indiaNewsBtn.classList.remove("active");
  loadNews("global");
};
indiaNewsBtn.onclick=()=>{
  indiaNewsBtn.classList.add("active"); globalNewsBtn.classList.remove("active");
  loadNews("india");
};

/* ===== REGIME / GAUGE ===== */
async function loadRegime(){
  const d = await j("/market-regime");
  if(!d) return;

  // Map pct-from-EMA200 → rotation angle [-90°, +90°]
  let pct = ((d.close - d.ema200) / d.ema200) * 100;
  pct = Math.max(-2, Math.min(2, pct));
  const angle = (pct / 2) * 90;

  // Wait for entry animation to finish (runs for ~1.9s total), then set real position
  setTimeout(() => {
    $("needle").style.transform = `rotate(${angle}deg)`;
  }, 2000);

  const header = $("regimeHeader");
  header.innerText = `Trend : ${d.trend_regime}`;

  const r = d.trend_regime.toLowerCase();
  if(r === "bullish"){
    header.style.background="rgba(22,163,74,.2)"; header.style.borderColor="#16a34a"; header.style.color="#4ade80";
  }else if(r === "bearish"){
    header.style.background="rgba(220,38,38,.2)"; header.style.borderColor="#dc2626"; header.style.color="#f87171";
  }else if(r === "correction" || r === "corrective"){
    header.style.background="rgba(234,179,8,.15)"; header.style.borderColor="#eab308"; header.style.color="#fde047";
  }else{
    header.style.background="rgba(30,41,59,.6)"; header.style.borderColor="#334155"; header.style.color="#94a3b8";
  }

  $("regimeUpdated").innerText = d.as_of ? "As of: " + d.as_of : "As of: Previous close";
}

refreshBtn.onclick=()=>{
  refreshBtn.classList.add("spinning");
  setTimeout(()=>refreshBtn.classList.remove("spinning"), 700);
  load(); loadNews(currentNews); loadRegime();
};

load();
loadNews("global");
loadRegime();
</script>

<!-- iframe height sync ONLY -->
<script>
window.addEventListener("message", (event) => {
  if (event.data?.type === "REGIME_HEIGHT") {
    const frame = document.getElementById("regimeFrame");
    const container = document.getElementById("regimeContainer");
    if (!frame || !container) return;
    const MAX_HEIGHT = 260;
    const h = Math.min(Math.max(event.data.height || 260, 200), MAX_HEIGHT);
    frame.style.height = h + "px";
    container.style.height = h + "px";
  }
});
</script>
<script>
function sendHeight() {
  const h = document.documentElement.scrollHeight || document.body.scrollHeight || 280;
  window.parent.postMessage({ type: "REGIME_HEIGHT", height: h }, "*");
}
window.addEventListener("load", sendHeight);
setTimeout(sendHeight, 100);
setTimeout(sendHeight, 300);
setTimeout(sendHeight, 600);
window.addEventListener("resize", sendHeight);
</script>
