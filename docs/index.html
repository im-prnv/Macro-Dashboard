<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class' }
</script>

<style>
.card {
  position: relative;
  display: flex;
  justify-content: space-between;
  padding: 1rem;
  border-radius: 0.75rem;
  border-left-width: 4px;
  background-color: white;
}
.dark .card { background-color: #1f2937; }

.tip-trigger {
  cursor: pointer;
  font-size: 0.9rem;
  opacity: 0.7;
}
.tooltip {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 0.5rem;
  max-width: min(260px, 90vw);
  background: #111827;
  color: white;
  padding: 0.75rem;
  border-radius: 0.5rem;
  font-size: 0.75rem;
  display: none;
  z-index: 50;
}
@media (hover:hover) {
  .tip-trigger:hover + .tooltip { display:block; }
}
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

<!-- HEADER -->
<header class="flex justify-between p-4 bg-gray-200 dark:bg-gray-800">
  <div>
    <div class="flex items-center gap-3">
      <img src="logo.png" class="h-8 w-8 object-contain" />
      <h1 class="text-xl font-semibold">Macro Dashboard</h1>
    </div>
    <div id="lastUpdated" class="text-xs opacity-70 mt-1">Last updated: --</div>
  </div>
  <div class="space-x-2">
    <button id="refreshBtn" class="bg-blue-600 text-white px-3 py-1 rounded">🔄</button>
    <button id="themeToggle" class="bg-gray-300 dark:bg-gray-700 px-3 py-1 rounded">🌙</button>
  </div>
</header>

<!-- MARKET CLIMATE -->
<section id="climateBanner"
  class="m-4 p-4 rounded-xl text-center font-semibold text-lg">
  Market Climate: --
</section>

<!-- ===== TREND REGIME CARD (NEW) ===== -->
<section class="m-4">
  <div id="trendCard" class="card">
    <div>
      Trend Regime <span class="tip-trigger">➜</span>
      <div class="tooltip">
        Based on Nifty daily close vs 50 & 200 EMA.
        <br/>🟢 Above EMA → Bullish
        <br/>🟡 Below 50 EMA → Corrective
        <br/>🔴 Below 50 & 200 EMA → Bearish
      </div>
    </div>
    <div class="text-right">
      <div id="trendRegime">--</div>
      <div id="trendNote" class="text-xs opacity-70"></div>
    </div>
  </div>
</section>

<main class="p-4 space-y-10">

<!-- ===== MACRO CARDS ===== -->
<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">
  <!-- (unchanged macro cards – SAME AS YOUR FILE) -->
</section>

<!-- ===== NEWS SECTION ===== -->
<section class="m-4 mt-10">
  <!-- (unchanged news section – SAME AS YOUR FILE) -->
</section>

</main>

<script>
const API = "https://macro-dashboard-vk03.onrender.com";
const $ = id => document.getElementById(id);
const setColor = (el,color)=>{ if(el) el.style.borderLeftColor=color };

// THEME (unchanged)
const themeToggle=$("themeToggle");
const saved=localStorage.getItem("theme");
if(saved==="light"){document.documentElement.classList.remove("dark");themeToggle.innerText="☀️";}
else{document.documentElement.classList.add("dark");themeToggle.innerText="🌙";}
themeToggle.onclick=()=>{
  const d=document.documentElement.classList.contains("dark");
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme",d?"light":"dark");
  themeToggle.innerText=d?"☀️":"🌙";
};

// FETCH
async function j(p){
  const r=await fetch(API+p);
  return r.ok?r.json():null;
}

// ===== TREND REGIME LOAD (NEW) =====
async function loadTrend(){
  const d = await j("/market-regime");
  if(!d) return;

  $("trendRegime").innerText = d.trend_regime;
  $("trendNote").innerText = "Daily TF • Prev Close";

  if(d.trend_regime === "Bullish"){
    setColor(trendCard, "green");
  }else if(d.trend_regime === "Corrective"){
    setColor(trendCard, "orange");
  }else{
    setColor(trendCard, "red");
  }
}

// ===== MACRO LOAD (UNCHANGED) =====
async function load(){
  /* your existing macro load code exactly as-is */
  $("lastUpdated").innerText="Last updated: "+new Date().toLocaleString();
}

refreshBtn.onclick=()=>{ load(); loadTrend(); };

// INITIAL LOAD
load();
loadTrend();
</script>

</body>
</html>
