<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class' }
</script>

<style>
.card{
  display:flex;justify-content:space-between;
  padding:1rem;border-radius:.75rem;
  border-left-width:4px;background:#fff
}
.dark .card{background:#1f2937}
svg{max-width:100%;height:auto}
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

<header class="flex justify-between p-4 bg-gray-200 dark:bg-gray-800">
  <div>
    <h1 class="text-xl font-semibold">Macro Dashboard</h1>
    <div id="lastUpdated" class="text-xs opacity-70 mt-1">Last updated: --</div>
  </div>
</header>

<!-- MARKET CLIMATE -->
<section id="climateBanner" class="m-4 p-4 rounded-xl text-center font-semibold text-lg">
  Market Climate: --
</section>

<!-- REGIME DIAL -->
<section class="m-4 p-4 rounded-xl bg-white dark:bg-gray-800 text-center">
  <div id="regimeHeader" class="font-semibold mb-1">
    Trend Daily TF: --
  </div>

  <svg viewBox="0 0 200 120" class="mx-auto">

    <!-- RED (Bearish) -->
    <path d="M10 100 A90 90 0 0 1 70 30"
          stroke="#dc2626" stroke-width="14" fill="none"/>

    <!-- YELLOW (Corrective) -->
    <path d="M70 30 A90 90 0 0 1 130 30"
          stroke="#facc15" stroke-width="14" fill="none"/>

    <!-- GREEN (Bullish) -->
    <path d="M130 30 A90 90 0 0 1 190 100"
          stroke="#16a34a" stroke-width="14" fill="none"/>

    <!-- EMA labels -->
    <text x="70" y="25" text-anchor="middle" font-size="10" fill="currentColor">200</text>
    <text x="130" y="25" text-anchor="middle" font-size="10" fill="currentColor">50</text>

    <!-- Needle -->
    <g id="needleGroup" transform="rotate(-30 100 100)">
      <line x1="100" y1="100" x2="100" y2="35"
            stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    </g>

    <circle cx="100" cy="100" r="6" fill="#111827"/>
  </svg>

  <div class="font-semibold mt-1">EMA</div>
  <div id="regimeUpdated" class="text-xs opacity-70 mt-1">Last updated: --</div>
</section>

<script>
const API="https://macro-dashboard-vk03.onrender.com";
const $=id=>document.getElementById(id);

async function j(p){
  try{const r=await fetch(API+p);return r.ok?await r.json():null}catch{return null}
}

/* ===== REGIME LOGIC ===== */
async function loadRegime(){
  const d=await j("/market-regime");
  if(!d||!d.close)return;

  const { close, ema200, trend_regime } = d;

  // % distance from EMA200
  let pct = ((close - ema200) / ema200) * 100;

  // clamp between -2% and +2%
  pct = Math.max(-2, Math.min(2, pct));

  let angle;
  if(pct <= 0){
    // Red zone: -90° to -30°
    angle = -30 + (pct / 2) * 60;
  }else{
    // Yellow side: -30° to +30°
    angle = -30 + (pct / 2) * 60;
  }

  $("needleGroup").setAttribute(
    "transform",
    `rotate(${angle} 100 100)`
  );

  $("regimeHeader").innerText = `Trend Daily TF: ${trend_regime}`;
  $("regimeUpdated").innerText = "Last updated: " + new Date().toLocaleString();
}

loadRegime();
</script>

</body>
</html>
