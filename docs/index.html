<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' }
</script>

<style>
  iframe { max-width: 100%; }

  .card{
    position:relative;
    display:flex;
    justify-content:space-between;
    padding:1rem;
    border-radius:.75rem;
    border-left-width:4px;
    background:#fff;
  }
  .dark .card{ background:#1f2937 }
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

<!-- HEADER -->
<header class="flex justify-between p-4 bg-gray-200 dark:bg-gray-800">
  <div>
    <div class="flex items-center gap-3">
      <img src="logo.png" class="h-8 w-8 object-contain" />
      <h1 class="text-xl font-semibold">Macro Dashboard</h1>
    </div>
    <div id="lastUpdated" class="text-xs opacity-70 mt-1">
      Last updated: --
    </div>
  </div>
  <div class="space-x-2">
    <button id="refreshBtn" class="bg-blue-600 text-white px-3 py-1 rounded">🔄</button>
    <button id="themeToggle" class="bg-gray-300 dark:bg-gray-700 px-3 py-1 rounded">🌙</button>
  </div>
</header>

<!-- MARKET CLIMATE -->
<section id="climateBanner"
  class="m-4 p-4 rounded-xl text-center font-semibold text-lg">
  Market Climate: --
</section>

<!-- REGIME INLINE -->
  <!-- TREND REGIME -->
<section class="mx-4 mt-3 p-4 rounded-xl bg-white dark:bg-slate-800 text-center">

  <div id="regimeHeader"
       class="mb-3 px-4 py-2 rounded-full font-semibold text-lg bg-gray-700 dark:bg-slate-700 text-white">
    Trend : --
  </div>

  <svg viewBox="0 0 200 110" class="mx-auto max-w-[420px]">

    <!-- RED (Below 200 EMA) -->
    <path d="M20 100 A80 80 0 0 1 70 40"
          stroke="#ef4444" stroke-width="14" fill="none"/>

    <!-- YELLOW (200–50 EMA) -->
    <path d="M70 40 A80 80 0 0 1 130 40"
          stroke="#facc15" stroke-width="14" fill="none"/>

    <!-- GREEN (Above 50 EMA) -->
    <path d="M130 40 A80 80 0 0 1 180 100"
          stroke="#16a34a" stroke-width="14" fill="none"/>

    <!-- EMA boundary labels -->
    <text x="70" y="50"
          text-anchor="middle"
          dominant-baseline="middle"
          class="fill-gray-700 dark:fill-gray-200 text-xs"
          transform="rotate(-30 70 50)">200</text>

    <text x="130" y="50"
          text-anchor="middle"
          dominant-baseline="middle"
          class="fill-gray-700 dark:fill-gray-200 text-xs"
          transform="rotate(30 130 50)">50</text>

    <!-- NEEDLE -->
    <g id="needle" transform="rotate(-30 100 100)">
      <line x1="100" y1="100" x2="100" y2="55"
            stroke="#111827" stroke-width="7"
            stroke-linecap="round"/>
      <line x1="100" y1="100" x2="100" y2="55"
            stroke="#f9fafb" stroke-width="4"
            stroke-linecap="round"/>
    </g>

    <!-- PIVOT -->
    <circle cx="100" cy="100" r="7" fill="#111827"/>
    <circle cx="100" cy="100" r="5" fill="#f9fafb"/>

  </svg>

  <div class="font-semibold mt-1 text-gray-700 dark:text-gray-200">
    EMA
  </div>

  <div id="regimeUpdated" class="text-xs opacity-70 mt-1">
    As of: --
  </div>
</section>


<!-- MACRO CARDS -->
<main class="p-4 space-y-10">

<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">
  <div id="dxyCard" class="card"><div>DXY</div><div><div id="dxy">--</div><div id="dxyPct" class="text-sm opacity-70"></div></div></div>
  <div id="jpyCard" class="card"><div>USD / JPY</div><div><div id="usdjpy">--</div><div id="usdjpyPct" class="text-sm opacity-70"></div></div></div>
  <div id="inrCard" class="card"><div>USD / INR</div><div><div id="usdinr">--</div><div id="usdinrPct" class="text-sm opacity-70"></div></div></div>
  <div id="crudeCard" class="card"><div>Brent</div><div><div id="crude">--</div><div id="crudePct" class="text-sm opacity-70"></div></div></div>
  <div id="us10yCard" class="card"><div>US 10Y</div><div><div id="us10y">--</div><div id="us10yPct" class="text-sm opacity-70"></div></div></div>
  <div id="us2yCard" class="card"><div>US 2Y</div><div><div id="us2y">--</div><div id="us2yPct" class="text-sm opacity-70"></div></div></div>
  <div id="spreadCard" class="card"><div>Yield Spread</div><div><div id="spread">--</div></div></div>
</section>

<!-- NEWS -->
<section class="m-4 mt-10">
  <div class="flex justify-between items-center mb-3">
    <h2 class="text-lg font-semibold">📰 Market News</h2>
    <div class="flex bg-gray-200 dark:bg-gray-700 rounded-lg p-1 text-xs">
      <button id="globalNewsBtn" class="px-3 py-1 rounded-md bg-blue-600 text-white">Global</button>
      <button id="indiaNewsBtn" class="px-3 py-1 rounded-md text-gray-700 dark:text-gray-200">India</button>
    </div>
  </div>

  <div class="rounded-xl border bg-white dark:bg-gray-800">
    <div id="newsList"
      class="max-h-96 overflow-y-auto divide-y divide-gray-200 dark:divide-gray-700 text-sm">
      <div class="p-3 opacity-60">Loading news…</div>
    </div>
  </div>
</section>

</main>

<script>
const API="https://macro-dashboard-vk03.onrender.com";
const $=id=>document.getElementById(id);
const setColor=(el,c)=>{ if(el) el.style.borderLeftColor=c };

// THEME
const themeToggle=$("themeToggle");
const saved=localStorage.getItem("theme");
if(saved==="light"){document.documentElement.classList.remove("dark");themeToggle.innerText="☀️";}
else{document.documentElement.classList.add("dark");themeToggle.innerText="🌙";}
themeToggle.onclick=()=>{
  const d=document.documentElement.classList.contains("dark");
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme",d?"light":"dark");
  themeToggle.innerText=d?"☀️":"🌙";
};

async function j(p){
  try{ const r=await fetch(API+p); return r.ok?await r.json():null; }
  catch{ return null; }
}

/* ===== MACRO + CLIMATE ===== */
async function load(){
  const dxy=await j("/dxy");
  const jpy=await j("/usd-jpy");
  const inr=await j("/usd-inr");
  const crude=await j("/crude");
  const y=await j("/us-yields");
  if(!dxy||!jpy||!inr||!crude||!y) return;

  $("dxy").innerText=dxy.dxy;
  $("dxyPct").innerText=dxy.pct_change+"%";
  setColor(dxyCard,dxy.dxy>100.5?"red":dxy.dxy>=99.5?"orange":"green");

  $("usdjpy").innerText=jpy.usd_jpy;
  $("usdjpyPct").innerText=jpy.pct_change+"%";
  setColor(jpyCard,jpy.usd_jpy<148?"red":jpy.usd_jpy<=150?"orange":"green");

  $("usdinr").innerText=inr.price;
  $("usdinrPct").innerText=inr.pct_change+"%";
  setColor(inrCard,inr.pct_change>0.5?"red":inr.pct_change>=0.2?"orange":"green");

  $("crude").innerText=crude.price;
  $("crudePct").innerText=crude.pct_change+"%";
  setColor(crudeCard,crude.pct_change>2.5?"red":crude.pct_change>=1?"orange":"green");

  $("us10y").innerText=y.us_10y;
  $("us10yPct").innerText=y.us_10y_pct+"%";
  setColor(us10yCard,y.us_10y>4.1?"red":y.us_10y>=3.9?"orange":"green");

  $("us2y").innerText=y.us_2y;
  $("us2yPct").innerText=y.us_2y_pct+"%";
  setColor(us2yCard,y.us_2y>4.2?"red":y.us_2y>=4.0?"orange":"green");

  $("spread").innerText=y.yield_spread;
  setColor(spreadCard,y.yield_spread<0?"red":y.yield_spread<=0.5?"orange":"green");

  let stress=0;
  if(dxy.dxy>100.5)stress++;
  if(jpy.usd_jpy<148)stress++;
  if(inr.pct_change>0.5)stress++;
  if(crude.pct_change>2.5)stress++;
  if(y.us_10y>4.1)stress++;
  if(y.us_2y>4.2)stress++;
  if(y.yield_spread<0)stress++;

  if(stress<=1){
    climateBanner.innerText="🌤️ Market Climate: Favorable";
    climateBanner.style.background="#16a34a";
  }else if(stress<=3){
    climateBanner.innerText="🌥️ Market Climate: Cautious";
    climateBanner.style.background="#facc15";
    climateBanner.style.color="black";
  }else{
    climateBanner.innerText="🌩️ Market Climate: Stressed";
    climateBanner.style.background="#dc2626";
  }

  $("lastUpdated").innerText="Last updated: "+new Date().toLocaleString();
}

/* ===== NEWS ===== */
let currentNews="global";
async function loadNews(region){
  currentNews=region;
  const box=$("newsList");
  box.innerHTML="<div class='p-3 opacity-60'>Loading news…</div>";
  try{
    const r=await fetch(`${API}/news?region=${region}`);
    const d=await r.json();
    box.innerHTML="";
    d.items.forEach(n=>{
      const div=document.createElement("div");
      div.className="p-3 hover:bg-gray-100 dark:hover:bg-gray-700";
      div.innerHTML=`<a href="${n.link}" target="_blank">${n.title}</a>`;
      box.appendChild(div);
    });
  }catch{
    box.innerHTML="<div class='p-3 text-red-500'>Failed to load news</div>";
  }
}

globalNewsBtn.onclick=()=>{globalNewsBtn.className="px-3 py-1 rounded-md bg-blue-600 text-white";
  indiaNewsBtn.className="px-3 py-1 rounded-md text-gray-700 dark:text-gray-200";
  loadNews("global");};

indiaNewsBtn.onclick=()=>{indiaNewsBtn.className="px-3 py-1 rounded-md bg-blue-600 text-white";
  globalNewsBtn.className="px-3 py-1 rounded-md text-gray-700 dark:text-gray-200";
  loadNews("india");};

async function loadRegime(){
  const d = await j("/market-regime");
  if(!d) return;

  // Needle logic (unchanged, correct)
  let pct = ((d.close - d.ema200) / d.ema200) * 100;
  pct = Math.max(-2, Math.min(2, pct));
  const angle = -30 + (pct / 2) * 60;

  $("needle").setAttribute(
    "transform",
    `rotate(${angle} 100 100)`
  );

  const header = $("regimeHeader");
  header.className =
    "mb-3 px-4 py-2 rounded-full font-semibold text-lg text-black";

  header.innerText = `Trend : ${d.trend_regime}`;

  const r = d.trend_regime.toLowerCase();
  if(r === "bullish"){
    header.style.background = "#16a34a";
    header.style.color = "white";
  }else if(r === "bearish"){
    header.style.background = "#dc2626";
    header.style.color = "white";
  }else if(r === "correction" || r === "corrective"){
    header.style.background = "#facc15";
    header.style.color = "#1f2937";
  }else{
    header.style.background = "#334155";
    header.style.color = "white";
  }

  $("regimeUpdated").innerText =
    d.as_of ? "As of: " + d.as_of : "As of: Previous close";
}

refreshBtn.onclick=()=>{ load(); loadNews(currentNews); loadRegime(); };

load();
loadNews("global");
loadRegime();
</script>

<!-- iframe height sync ONLY -->
<script>
window.addEventListener("message", (event) => {
  if (event.data?.type === "REGIME_HEIGHT") {
    const frame = document.getElementById("regimeFrame");
    const container = document.getElementById("regimeContainer");
    if (!frame || !container) return;

    const MAX_HEIGHT = 260;
    const h = Math.min(
  Math.max(event.data.height || 260, 200),
  MAX_HEIGHT
);
    frame.style.height = h + "px";
    container.style.height = h + "px";
  }
});
</script>
<script>
function sendHeight() {
  const h =
    document.documentElement.scrollHeight ||
    document.body.scrollHeight ||
    280; // fallback

  window.parent.postMessage(
    { type: "REGIME_HEIGHT", height: h },
    "*"
  );
}

// Fire multiple times to catch SVG + fonts
window.addEventListener("load", sendHeight);
setTimeout(sendHeight, 100);
setTimeout(sendHeight, 300);
setTimeout(sendHeight, 600);
window.addEventListener("resize", sendHeight);
</script>

</body>
</html>
