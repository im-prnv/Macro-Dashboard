<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class' }
</script>

<style>
.card {
  position: relative;
  display: flex;
  justify-content: space-between;
  padding: 1rem;
  border-radius: 0.75rem;
  border-left-width: 4px;
  background-color: white;
}
.dark .card { background-color: #1f2937; }

svg { max-width: 100%; height: auto; }
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

<!-- HEADER -->
<header class="flex justify-between p-4 bg-gray-200 dark:bg-gray-800">
  <div>
    <div class="flex items-center gap-3">
      <img src="logo.png" class="h-8 w-8 object-contain" />
      <h1 class="text-xl font-semibold">Macro Dashboard</h1>
    </div>
    <div id="lastUpdated" class="text-xs opacity-70 mt-1">Last updated: --</div>
  </div>
  <div class="space-x-2">
    <button id="refreshBtn" class="bg-blue-600 text-white px-3 py-1 rounded">🔄</button>
    <button id="themeToggle" class="bg-gray-300 dark:bg-gray-700 px-3 py-1 rounded">🌙</button>
  </div>
</header>

<!-- MARKET CLIMATE -->
<section id="climateBanner" class="m-4 p-4 rounded-xl text-center font-semibold text-lg">
  Market Climate: --
</section>

<!-- SPEEDOMETER REGIME -->
<section class="m-4 p-4 rounded-xl bg-white dark:bg-gray-800 text-center">
  <h2 class="font-semibold mb-2">Trend Regime</h2>

  <svg viewBox="0 0 200 110" class="mx-auto">
    <!-- Red zone -->
    <path d="M10 100 A90 90 0 0 1 70 20" fill="none" stroke="#dc2626" stroke-width="14"/>
    <!-- Yellow zone -->
    <path d="M70 20 A90 90 0 0 1 130 20" fill="none" stroke="#facc15" stroke-width="14"/>
    <!-- Green zone -->
    <path d="M130 20 A90 90 0 0 1 190 100" fill="none" stroke="#16a34a" stroke-width="14"/>

    <!-- Needle -->
    <line id="needle"
          x1="100" y1="100"
          x2="100" y2="30"
          stroke="black"
          stroke-width="3"
          stroke-linecap="round"
          transform-origin="100px 100px"
          transform="rotate(-90 100 100)" />

    <!-- Center dot -->
    <circle cx="100" cy="100" r="5" fill="black"/>
  </svg>

  <div id="regimeText" class="font-semibold mt-2">--</div>
  <div id="regimeUpdated" class="text-xs opacity-70">--</div>
</section>

<main class="p-4 space-y-10">

<!-- MACRO CARDS -->
<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">
  <div id="dxyCard" class="card"><div>DXY</div><div><div id="dxy">--</div><div id="dxyPct" class="text-sm opacity-70"></div></div></div>
  <div id="jpyCard" class="card"><div>USD / JPY</div><div><div id="usdjpy">--</div><div id="usdjpyPct" class="text-sm opacity-70"></div></div></div>
  <div id="inrCard" class="card"><div>USD / INR</div><div><div id="usdinr">--</div><div id="usdinrPct" class="text-sm opacity-70"></div></div></div>
  <div id="crudeCard" class="card"><div>Brent</div><div><div id="crude">--</div><div id="crudePct" class="text-sm opacity-70"></div></div></div>
  <div id="us10yCard" class="card"><div>US 10Y</div><div><div id="us10y">--</div><div id="us10yPct" class="text-sm opacity-70"></div></div></div>
  <div id="us2yCard" class="card"><div>US 2Y</div><div><div id="us2y">--</div><div id="us2yPct" class="text-sm opacity-70"></div></div></div>
  <div id="spreadCard" class="card"><div>Yield Spread</div><div><div id="spread">--</div></div></div>
</section>

<!-- NEWS -->
<section class="m-4 mt-10">
  <h2 class="text-lg font-semibold mb-3">📰 Market News</h2>
  <div class="rounded-xl border bg-white dark:bg-gray-800">
    <div id="newsList" class="max-h-96 overflow-y-auto divide-y text-sm">
      <div class="p-3 opacity-60">Loading news…</div>
    </div>
  </div>
</section>

</main>

<script>
const API="https://macro-dashboard-vk03.onrender.com";
const $=id=>document.getElementById(id);

// THEME
const t=$("themeToggle");
const s=localStorage.getItem("theme");
if(s==="light"){document.documentElement.classList.remove("dark");t.innerText="☀️";}
else{document.documentElement.classList.add("dark");t.innerText="🌙";}
t.onclick=()=>{
  const d=document.documentElement.classList.contains("dark");
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme",d?"light":"dark");
  t.innerText=d?"☀️":"🌙";
};

async function j(p){
  try{
    const r=await fetch(API+p);
    return r.ok?await r.json():null;
  }catch{return null;}
}

// SPEEDOMETER LOGIC
async function loadRegime(){
  const d=await j("/market-regime");
  if(!d||!d.close){ return; }

  const { close, ema50, ema200, trend_regime } = d;

  // Normalize position between EMA200 and EMA50
  let pos = (close - ema200) / (ema50 - ema200);
  pos = Math.max(-0.2, Math.min(1.2, pos)); // clamp

  // Map to angle (-90 to +90)
  const angle = -90 + pos * 180;

  $("needle").setAttribute(
    "transform",
    `rotate(${angle} 100 100)`
  );

  $("regimeText").innerText = trend_regime;
  $("regimeUpdated").innerText = "Based on previous close";
}

// NEWS
async function loadNews(){
  const box=$("newsList");
  try{
    const r=await fetch(`${API}/news?region=global`);
    const d=await r.json();
    box.innerHTML="";
    d.items.forEach(n=>{
      const div=document.createElement("div");
      div.className="p-3 hover:bg-gray-100 dark:hover:bg-gray-700";
      div.innerHTML=`<a href="${n.link}" target="_blank">${n.title}</a>`;
      box.appendChild(div);
    });
  }catch{
    box.innerHTML="<div class='p-3 text-red-500'>Failed to load news</div>";
  }
}

loadRegime();
loadNews();
</script>

</body>
</html>
