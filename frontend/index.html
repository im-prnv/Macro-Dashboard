<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class' }
</script>

<style>
.card{
  position:relative;
  display:flex;
  justify-content:space-between;
  padding:1rem;
  border-radius:0.75rem;
  border-left-width:4px;
  background:#fff
}
.dark .card{background:#1f2937}

.tip-trigger{cursor:pointer;font-size:.9rem;opacity:.7}
.tooltip{
  position:absolute;
  top:100%;
  left:0;
  margin-top:.5rem;
  max-width:min(260px,90vw);
  background:#111827;
  color:#fff;
  padding:.75rem;
  border-radius:.5rem;
  font-size:.75rem;
  display:none;
  z-index:50
}
@media(hover:hover){
  .tip-trigger:hover+.tooltip{display:block}
}
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

<!-- HEADER -->
<header class="flex justify-between p-4 bg-gray-200 dark:bg-gray-800">
  <div>
    <div class="flex items-center gap-3">
      <img src="logo.png" class="h-8 w-8 object-contain">
      <h1 class="text-xl font-semibold">Macro Dashboard</h1>
    </div>
    <div id="lastUpdated" class="text-xs opacity-70 mt-1">Last updated: --</div>
  </div>
  <div class="space-x-2">
    <button id="refreshBtn" class="bg-blue-600 text-white px-3 py-1 rounded">🔄</button>
    <button id="themeToggle" class="bg-gray-300 dark:bg-gray-700 px-3 py-1 rounded">🌙</button>
  </div>
</header>

<!-- MARKET CLIMATE -->
<section id="climateBanner" class="m-4 p-4 rounded-xl text-center font-semibold text-lg">
  Market Climate: --
</section>

<!-- TREND REGIME -->
<section class="m-4">
  <div id="trendCard" class="card">
    <div>
      Trend Regime <span class="tip-trigger">➜</span>
      <div class="tooltip">
        Based on Nifty daily close vs 50 & 200 EMA<br>
        🟢 Above EMA → Bullish<br>
        🟡 Below 50 EMA → Corrective<br>
        🔴 Below 50 & 200 EMA → Bearish
      </div>
    </div>
    <div class="text-right">
      <div id="trendRegime">--</div>
      <div id="trendNote" class="text-xs opacity-70">Daily TF • Prev Close</div>
    </div>
  </div>
</section>

<main class="p-4 space-y-10">

<!-- MACRO CARDS -->
<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">

  <div id="dxyCard" class="card">
    <div>DXY</div>
    <div class="text-right">
      <div id="dxy">--</div>
      <div id="dxyPct" class="text-sm opacity-70"></div>
    </div>
  </div>

  <div id="jpyCard" class="card">
    <div>USD / JPY</div>
    <div class="text-right">
      <div id="usdjpy">--</div>
      <div id="usdjpyPct" class="text-sm opacity-70"></div>
    </div>
  </div>

  <div id="inrCard" class="card">
    <div>USD / INR</div>
    <div class="text-right">
      <div id="usdinr">--</div>
      <div id="usdinrPct" class="text-sm opacity-70"></div>
    </div>
  </div>

  <div id="crudeCard" class="card">
    <div>Brent</div>
    <div class="text-right">
      <div id="crude">--</div>
      <div id="crudePct" class="text-sm opacity-70"></div>
    </div>
  </div>

  <div id="us10yCard" class="card">
    <div>US 10Y</div>
    <div class="text-right">
      <div id="us10y">--</div>
      <div id="us10yPct" class="text-sm opacity-70"></div>
    </div>
  </div>

  <div id="us2yCard" class="card">
    <div>US 2Y</div>
    <div class="text-right">
      <div id="us2y">--</div>
      <div id="us2yPct" class="text-sm opacity-70"></div>
    </div>
  </div>

  <div id="spreadCard" class="card">
    <div>Yield Spread</div>
    <div class="text-right">
      <div id="spread">--</div>
    </div>
  </div>

</section>
</main>

<script>
const API="https://macro-dashboard-vk03.onrender.com";
const $=id=>document.getElementById(id);
const setColor=(el,c)=>{if(el)el.style.borderLeftColor=c};

// THEME
const t=$("themeToggle");
const s=localStorage.getItem("theme");
if(s==="light"){document.documentElement.classList.remove("dark");t.innerText="☀️";}
else{document.documentElement.classList.add("dark");t.innerText="🌙";}
t.onclick=()=>{
  const d=document.documentElement.classList.contains("dark");
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme",d?"light":"dark");
  t.innerText=d?"☀️":"🌙";
};

// FETCH HELPER
async function j(p){
  try{
    const r=await fetch(API+p);
    return r.ok?await r.json():null;
  }catch{return null;}
}

// TREND REGIME
async function loadTrend(){
  const d=await j("/market-regime");
  if(!d||d.trend_regime==="Unavailable"){
    $("trendRegime").innerText="Data issue";
    setColor(trendCard,"gray");
    return;
  }
  $("trendRegime").innerText=d.trend_regime;
  setColor(trendCard,
    d.trend_regime==="Bullish"?"green":
    d.trend_regime==="Corrective"?"orange":"red"
  );
}

// MACRO + CLIMATE
async function load(){
  const dxy=await j("/dxy");
  if(!dxy)return;

  const jpy=await j("/usd-jpy");
  const inr=await j("/usd-inr");
  const crude=await j("/crude");
  const y=await j("/us-yields");

  $("dxy").innerText=dxy.dxy;
  $("dxyPct").innerText=dxy.pct_change+"%";
  setColor(dxyCard,dxy.dxy>100.5?"red":dxy.dxy>=99.5?"orange":"green");

  if(jpy){
    $("usdjpy").innerText=jpy.usd_jpy;
    $("usdjpyPct").innerText=jpy.pct_change+"%";
  }
  if(inr){
    $("usdinr").innerText=inr.price;
    $("usdinrPct").innerText=inr.pct_change+"%";
  }
  if(crude){
    $("crude").innerText=crude.price;
    $("crudePct").innerText=crude.pct_change+"%";
  }
  if(y){
    $("us10y").innerText=y.us_10y;
    $("us2y").innerText=y.us_2y;
    $("spread").innerText=y.yield_spread;
  }

  let stress=0;
  if(dxy.dxy>100.5)stress++;
  if(jpy&&jpy.usd_jpy<148)stress++;
  if(inr&&inr.pct_change>0.5)stress++;
  if(crude&&crude.pct_change>2.5)stress++;
  if(y&&y.us_10y>4.1)stress++;
  if(y&&y.us_2y>4.2)stress++;
  if(y&&y.yield_spread<0)stress++;

  if(stress<=1){
    climateBanner.innerText="🌤️ Market Climate: Favorable";
    climateBanner.style.background="#16a34a";
    climateBanner.style.color="white";
  }else if(stress<=3){
    climateBanner.innerText="🌥️ Market Climate: Cautious";
    climateBanner.style.background="#facc15";
    climateBanner.style.color="black";
  }else{
    climateBanner.innerText="🌩️ Market Climate: Stressed";
    climateBanner.style.background="#dc2626";
    climateBanner.style.color="white";
  }

  $("lastUpdated").innerText="Last updated: "+new Date().toLocaleString();
}

$("refreshBtn").onclick=()=>{load();loadTrend();};
load();loadTrend();
</script>

</body>
</html>
